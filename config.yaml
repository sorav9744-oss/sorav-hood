# JoshiClip configuration. Every weight, threshold, lexicon path and preset lives here.
# Changing a section invalidates only the cached stages that depend on it.

paths:
  work: work            # work/<video_id>/<stage>.json|.npy
  out: out              # out/<video_id>/short_NN.mp4 + report
  downloads: data/downloads
  models: models
  lexicon: config/lexicon.yaml
  style_ref: reference/style_ref_02_user.png
  style_ref_metrics: research/style_ref_metrics.json
  research: research

tools:
  ffmpeg: null          # absolute path override; null = auto-resolve (shutil.which -> registry PATH -> known dirs)
  fpcalc: null

channel:
  # Sourav Joshi Vlogs. UC<rest> -> UULF<rest> (long videos), UUSH<rest> (Shorts).
  official_id: UCjvgGbPPn-FgYeguc5nxG4A
  official_vlogs_url: https://www.youtube.com/@souravjvlogs
  official_shorts_url: https://www.youtube.com/@souravjocshorts/shorts
  fan_urls: [https://www.youtube.com/@SouravAvantikaFun]
  fan_ids: [UCxaaicd0KNuc41-c0e5R2Cg]   # @SouravAvantikaFun
  fan_shorts_playlists: [UUSHxaaicd0KNuc41-c0e5R2Cg]

research:
  catalog_file: catalog.json
  report_file: report.json
  latest_vlogs: 60
  pair_max_day_delta: 1
  pair_min_keyword_overlap: 1
  pair_min_score: 0.35
  normalize_as_of: null                # null = current UTC date at research time
  audio_sample_rate: 8000
  audio_block_s: 2.0
  consensus_overlap_frac: 0.35
  category_patterns:
    drama_relationship: [saas, bahu, taunt, gussa, daant, ladai, jhagda, husband, wife, shaadi, breakup]
    festival_emotional: [birthday, diwali, holi, rakhi, puja, emotional, surprise, ro, rona, yaad, miss]
    dance: [dance, naach, nach, thumka, song, gaana]
    funny_accident: [funny, comedy, hasi, hahaha, gir, gira, palat, bheeg, splash, accident]
    money_numbers: [rupee, rs, lakh, crore, paisa, price, bill, number]
    family_home: [saas, sasur, bahu, amma, mummy, papa, dadi, nani, khana, khaana, rasoi, kitchen, cooking, ghar]
    danger_loss_fear: [bach gaye, danger, darr, dar lag, dara diya, loss, chot, takra, police]   # "gaya/gayi/kho" matched every title
    travel_scenery: [trip, travel, vacation, pahad, mountain, beach, flight, hotel, road]
    montage: [moments, memories, best, highlights, vlog, family]

boundaries:                              # deterministic best start/end per moment (joshiclip/boundaries.py)
  enabled: true
  min_s: 30                              # user: Shorts were too short (8-20 s)
  max_s: 58
  pref_s: [38, 50]
  min_lead_s: 4                          # the clip starts at least 4 s before the peak ...
  max_lead_s: 40                         # ... and at most 40 s before it
  min_tail_s: 2                          # ends 2-25 s after the peak (room for the reaction)
  max_tail_s: 25
  max_pre_roll_s: 0.6                    # cut point = quietest 10 ms inside the silence before the first word (<= 0.6 s)
  max_post_roll_s: 0.6                   # ... and after the last word
  hook_face_s: 2.0                       # user: a Short starts on someone talking with their face on screen ...
  hook_face_min: 0.5                     # ... a face >= 10 % of the frame in >= 50 % of its first 2 s (0 = off)
  shout_weight: 0.6                      # user: loud shouting / screaming moments must be shown -> big priority boost

engine:
  mode: moment_first                    # moment_first | legacy
  min_shorts: 5
  max_shorts: 8                          # best 8 by score (render time ~4 min per Short on this CPU)
  min_score: 0.60                       # drops weak no-shout moments with only a template title
  excited_min_z: 3.0                     # loud excited speech (robust z) that becomes its own moment card
  must_peak_strength: 3.0                # scream/laugh/cheer peaks this strong are never dropped for a missing who/what
  incident_window_s: 14
  story_min_s: 38
  story_max_s: 50
  incident_min_s: 8
  incident_max_s: 30
  max_overlap_frac: 0.0                  # two Shorts never share footage (they were back to back at 16:46)
  montage_enabled: true
  montage_piece_s: [2, 4]

viewers:                                 # fans' "2:40 piyush 😂😂" timestamps in the vlog's top comments (joshiclip/viewers.py)
  enabled: true
  allow_network: true
  max_comments: 600                      # ~30 s via yt-dlp; on 4H_oOhnN6Dc: 198 timestamps
  refresh_hours: 12                      # comments keep arriving after upload; refetch when the cache is older
  timeout_s: 240
  min_t_s: 20                            # "0:04 first comment" spam lives in the first seconds
  hotspot_min_comments: 3                # >= 3 different comments within +-6 s ...
  hotspot_min_weight: 5.0                # ... and enough likes -> its own Short candidate
  weight: 0.8                            # ranking boost for the moment viewers pointed at most (0..1 score)
  titles: true                           # header title = most-liked clean viewer line about the clip, if any
  title_min_likes: 3

upload:                                  # out/<vid>/upload.md: YouTube title / description / hashtags per Short
  title_hashtags: ["#shorts", "#souravjoshivlogs", "#souravjoshi"]       # user: "<title> #shorts #souravjoshivlogs #souravjoshi"
  channel_hashtags: ["#shorts", "#souravjoshivlogs", "#souravjoshi"]     # description's hashtag line (+ names / category)
  keywords:                              # description "Keywords:" line + YouTube's hidden tags (user: 20-30)
    - sourav joshi
    - sourav joshi vlogs
    - sourav joshi vlog
    - sourav joshi new vlog
    - sourav joshi latest vlog
    - sourav joshi today vlog
    - sourav joshi shorts
    - sourav joshi family
    - sourav joshi funny
    - sourav joshi comedy
    - sourav joshi daily vlog
    - joshi family
    - piyush joshi
    - sahil joshi
    - sourav joshi brother
    - sourav joshi mummy
    - sourav joshi papa
    - sourav joshi dadi
    - avantika
    - kunali
    - oreo toffee
    - sourav joshi vlogs shorts
    - souravjoshivlogs
    - indian family vlog
    - hindi vlog
    - daily vlog
    - family vlog
    - youtube shorts
  max_keywords: 30
  title_suffix: ""                       # e.g. "| Sourav Joshi Vlogs"
  credit_line: "Credit: Sourav Joshi Vlogs (original video linked above)"
  max_hashtags: 6

download:
  update_first: true                     # yt-dlp -U before every download session
  sleep_interval: 3
  max_sleep_interval: 8
  socket_timeout: 20                     # a stalled request is retried instead of hanging forever
  format: "bv*[height<=2160]+ba/b"
  merge_format: mkv

normalize:
  allowed_fps: [30, 60]                  # source nominal fps is snapped to the nearest of these
  max_height: 2160                       # keep 4K when the source has it (final renders can be 2160x3840)
  video_codec: libx264
  crf: 15
  preset: superfast                      # x264 preset for the one-time CFR normalization (4K veryfast took 2.6 h)
  x264_threads: 0                        # 0 = auto; fixed value keeps the bitstream reproducible
  hwaccel_decode: none                   # none | qsv  (decode only; QSV VP9/H.264 decoding is bit-exact)
  audio_codec: flac                      # lossless + no encoder priming delay -> sample-exact cuts
  audio_rate: 48000
  proxy_height: 360
  proxy_max_fps: 30                      # proxy fps = norm fps if <= this, else norm fps / 2
  proxy_crf: 28

sync:
  max_av_offset_ms: 40
  probe_len_s: 1.5

asr:
  engine: faster-whisper
  model: large-v3                        # chosen by research/ASR_BENCHMARK.md (accuracy > speed; runs once, cached)
  candidates: [large-v3-turbo, large-v3]
  model_paths:                           # local CTranslate2 dirs (else HF cache / download)
    large-v3: "../sourav's jyoshi/models/faster-whisper-large-v3"
  compute_type: int8
  cpu_threads: 8
  language: hi
  beam_size: 5
  temperature: 0.0
  vad_filter: true
  condition_on_previous_text: false
  bench_excerpt_s: [300, 420]            # excerpt used by `joshiclip bench-asr`

align:
  engine: mms_fa                         # torchaudio MMS forced aligner on romanized words | none
  max_shift_s: 0.25                      # refined word edges may move at most this far from Whisper's
  vad_threshold: 0.5

sentences:
  end_punct: ["।", "?", "!", ".", "|"]
  segment_split_pause_s: 0.2            # Whisper segment end + >=0.2 s gap also ends a sentence (hi output has ~no punctuation)
  split_pause_s: 0.6                     # also split at word gaps >= this
  max_len_s: 12.0                        # split long run-ons at the largest internal gap
  min_len_s: 0.6

diarization:
  engine: mfcc_agglomerative             # lightweight, deterministic
  distance_threshold: 6.0
  max_speakers: 6
  min_sentence_s: 0.8

features:
  frame_hop_s: 0.01
  pitch_fmin: 70
  pitch_fmax: 500
  vision_fps: 2                          # faces / motion / colour histograms on the proxy
  face_detector: yunet                   # yunet (finds small/side faces in wide vlog shots: 66% vs 42% of frames) | mediapipe
  face_min_confidence: 0.6
  yamnet_classes:
    laugh: [Laughter, Giggle, Chuckle, chortle, Belly laugh, Baby laughter, Snicker]
    cheer: [Cheering, Applause, Crowd, Children shouting]
    scream: [Screaming, Shout, Yell, Bellow, Whoop, Battle cry]
    music: [Music]
    gasp: [Gasp]
    cry: [Crying, sobbing, Baby cry, infant cry, Whimper]
    dog: [Dog, Bark, Yip, Howl, Growling]
  scene_threshold: 27.0                  # PySceneDetect ContentDetector

topics:
  block_sentences: 4                     # TextTiling block size (sentences)
  boundary_min_depth: 0.12
  location_hist_window_s: 5
  location_hist_threshold: 0.7           # Bhattacharyya distance; handheld footage: median 0.25, p90 0.48, p99 0.70
  ambience_threshold: 0.35
  weights: {text: 0.5, location: 0.3, ambience: 0.2}
  boundary_threshold: 0.55
  pause_bonus: 0.15                      # added for pauses of 1-4 s before a sentence
  min_gap_s: 10                          # at most one boundary per 10 s (strongest wins)

peaks:
  min_separation_s: 8
  min_z: 1.5
  weights: {laugh: 1.0, scream: 0.9, cheer: 0.6, energy: 0.5, gasp: 0.6, reveal: 0.6, comments: 1.2}

candidates:
  len_pref_s: [40, 50]
  len_allow_s: [35, 55]
  max_ends_per_start: 2

filters:
  intro_window_s: 5                      # intro/outro phrases are checked in the first N seconds of a clip
  edge_zone_s: 30                        # candidates in the first/last 30 s of the video ...
  edge_keep_top_pct: 5                   # ... survive only when in the top 5% by score
  min_pause_before_s: 0.6
  min_speech_frac: 0.5
  max_no_face_frac: 0.6
  location_change_zone: [0.1, 0.9]      # a location change inside this part of the clip rejects it
  location_change_score: 0.65            # colour shift (Bhattacharyya) ...
  location_ambience_shift: 0.35          # ... + scene cut within 2 s + ambience change = new location
  phrase_match_ratio: 85                 # rapidfuzz partial ratio on phonetic keys

scoring:
  hook_window_s: 3
  weights_final: {hook: 0.40, story: 0.45, viewer: 0.15}
  hook:
    first_word: 1.0
    first_sentence: 0.8
    energy_jump: 0.8
    pitch_jump: 0.5
    question: 0.7
    reveal: 0.8
    danger: 0.9
    conflict: 0.6
    funny: 1.0
    name_call: 0.5
    emotional: 0.5
    open_loop: 0.6
    lexicon: 0.5
  story:
    setup: 0.6
    arc: 1.0
    peak_position: 0.8
    payoff: 1.0
    one_scene: 0.5
    coherence: 0.6
    interaction: 0.7
    dead_air: 0.8          # penalty weight
    viewer: 0.0            # viewer signal lives in the final blend
    loop: 0.2
  peak_pos_range: [0.55, 0.85]
  payoff_after_peak_s: 8
  end_after_payoff_s: 4
  dead_air_gap_s: 1.5
  first_word_best_s: 0.4
  first_word_worst_s: 2.0
  round: 6

selection:
  seconds_per_short: 120
  min_shorts: 3
  max_shorts: 6
  min_score: 0.35
  max_overlap_frac: 0.10
  region_s: 120
  max_per_region: 2

jumpcuts:                                # micro jump cuts ONLY inside fully silent stretches (never inside speech)
  enabled: true
  min_silence_s: 0.6                     # user: cut wherever nobody is talking (gap with no speech, no shout/laugh) ...
  keep_pad_s: 0.15                       # ... keeps this much silence on each side; the middle is cut
  quiet_percentile: 45                   # a gap must also be quiet: 80 % of 10 ms frames below this loudness percentile (+3 dB)
  edge_guard_s: 1.0                      # never cut in the first/last second of a Short
  max_cut_frac: 0.35                     # cut at most 35 % of a Short ...
  min_out_s: 30                          # ... and never below 30 s (boundaries.min_s)
  word_max_s: 0.6                        # caption words count at most 0.6 s (YouTube pads a line's last word to 1.2 s)
  music_enabled: true                    # user: only music playing (nobody talks) -> trim it a little
  music_min_s: 2.0                       # no speech this long while YAMNet hears music ...
  music_min_prob: 0.5
  music_cut_frac: 0.4                    # ... cut 40 % from its middle ...
  music_keep_s: 1.0                      # ... keeping >= 1 s of it on each side
  fade_ms: 6                             # tiny audio fades at each join (no clicks)

layout:                                  # measured from reference/style_ref_02_user.png
  vertical: true
  canvas_draft: [720, 1280]
  canvas_final: [1080, 1920]
  header_frac: 0.085                     # white header with the title
  video_frac: 0.823                      # footage full-width below it; the rest is a white footer band
  title_font: C:/Windows/Fonts/segoeuib.ttf
  emoji_font: C:/Windows/Fonts/seguiemj.ttf
  title_size_frac: 0.030
  title_margin_frac: 0.04
  sticker: false                         # user: no big emoji on the footage (emojis stay in the title header)
  sticker_size_frac: 0.17
  sticker_y_frac: 0.11
  captions: false                        # user: no captions on the video
  caption_font: C:/Windows/Fonts/segoeuib.ttf
  caption_size_frac: 0.030               # ~4 % of height incl. outline
  caption_max_words: 3
  caption_y_frac: 0.50                   # vertical middle of the footage ...
  caption_y_alt_frac: 0.80               # ... or lower when a face is in the way
  caption_highlight: [255, 214, 10]

camera:
  zoom_min: 1.00
  zoom_max: 1.08
  zoom_sigma_s: 2.5
  omega: 2.2                             # spring stiffness (rad/s): slow, critically damped
  deadzone: 0.12                         # ignore face moves smaller than 12 % of the crop width

look:                                    # starting point; tune() matches the reference within +-10 %
  black: 2.0
  white: 98.0
  gamma: 1.0
  shoulder: 0.35
  lift: 0.02
  clahe: 1.8
  clahe_mix: 0.6
  vibrance: 1.25
  sharpen: 0.35
  glow: 0.05
  glow_thr: 0.75
  clarity: 0.5

look_tune:
  tonal_strength: 0.30                   # user: less HDR (0.35 -> 0.30 on 2026-11-21: "thoda hdr kam")
  color_strength: 0.45                   # colour + local contrast (0.55 -> 0.45, user: a little less HDR)

voice:
  denoise: true
  separator: none                        # none = keep the ORIGINAL sound (no noise removal) | dfn | demucs
  pitch_semitones: 0.0                   # user: keep his original voice (no deepening); duration-preserving if set
  formant: preserved
  low_shelf_hz: 150
  low_shelf_db: 1.5
  mud_cut_db: -1.5
  presence_db: 1.5
  comp_ratio: 1.8
  reverb_wet: 0.035                      # user: only a little echo
  reverb_decay_s: 0.5
  reverb_predelay_s: 0.02
  reverb_highcut_hz: 6000
  echo_taps: [[110, -32]]                # one faint slap echo (ms, dB)
  duck_db: -18
  bg_gap_db: -6
  duck_attack_ms: 50
  duck_release_ms: 300
  target_lufs: -14
  true_peak_db: -1.0

daily:                                   # `joshiclip daily run|plan|post` (joshiclip/daily.py) + .github/workflows/daily.yml
  channels:                              # name -> GitHub secrets <env>_CLIENT_ID / _CLIENT_SECRET / _REFRESH_TOKEN
    # one repo per channel; each repo reads the other's state/ so no scene is ever posted twice (any channel).
    # crons = this channel's plan + catch-up times in .github/workflows/daily.yml (UTC); channel_b plans 1.5 h
    # after channel_a, so it always sees channel_a's plan of the day.
    - {name: channel_a, env: YT_A, repo: prajmulik49-stack/s-clips, crons: ["30 19 * * *", "30 20 * * *", "30 23 * * *"]}   # 01:00 + 02:00 + 05:00 IST (GitHub sometimes drops a scheduled run)
    - {name: channel_b, env: YT_B, repo: sorav9744-oss/sorav-hood, crons: ["0 22 * * *", "0 23 * * *", "0 0 * * *"], after: channel_a}   # 03:30 + 04:30 + 05:30 IST; plans after channel_a's plan, yields on any clash
  per_channel: 6                         # free API quota = 10,000 units/day = 6 uploads (1,600 each) per Cloud project
  latest_per_channel: [2, 2]             # 2 from the newest vlog ...
  max_per_old_vlog: 4                    # ... + 2 per channel from each of 2 older vlogs (4 per old vlog in total): one already analysed (cache,
                                         # instant) + one RANDOM old vlog from the pool (variety; recorded once)
  vlog_pool: 200                         # how far back "older vlogs" go
  max_moments_per_vlog: 20
  media:                                 # joshiclip/phone.py + mediastore.py: the Android phone downloads, GitHub renders
    repo: prajmulik49-stack/s-clips-media  # PRIVATE repo; its release "media" holds the handover files (MEDIA_TOKEN)
    tag: media
    phone_time: "00:30"                  # IST: phone starts (360p copies -> starts channel_a's run -> its clips -> channel_b)
    old_vlogs: 4                         # newest + 4 older vlogs a night (2 spares if one has no unused scenes)
    old_pool: 80                         # older vlogs are picked from the newest 80
    plan_wait_min: 120                   # phone waits this long for a channel's plan
    clip_wait_min: 150                   # GitHub's post job waits this long for the phone's 1080p clips
    keep_days: 4                         # handover files older than this are deleted
  wait_partner_plan_min: 40              # channel_b waits up to 40 min for channel_a's plan of the day (late GitHub crons)
  reserve_days: 2                        # a planned scene stays blocked this long even if its upload failed
  utc_offset_min: 330                    # IST
  schedule: true                         # upload as private + publishAt at these IST times
  # IST. User (2026-11-21): newest vlog's 2 Shorts at 08:30 + 09:00 (after Sourav's vlog), old vlogs' 4 at
  # 07:00, 07:30 and 18:00, 19:00. Best score gets the first time of its list.
  publish_latest: ["08:30", "09:00"]
  publish_old: ["07:00", "07:30", "18:00", "19:00"]
  publish_times: ["07:00", "07:30", "08:30", "09:00", "18:00", "19:00"]   # fallback when the two lists are unset
  channel_offset_min: [0, 0]             # user: both channels post at the same times (always different scenes)
  privacy: public                        # used when schedule is false
  category_id: "24"                      # Entertainment
  plan_max_minutes: 35                   # whole daily run < 2 h: no new vlog is started after 35 min of planning
  post_max_minutes: 75
  delete_after_upload: true              # uploaded Shorts + their 4K source clips are deleted (only reports stay)
  cache_max_gb: 6                       # work/*-fast analyses kept (GitHub cache limit is 10 GB/repo); oldest-used go first
  record_budget_minutes: 45              # all of today's clip recordings share this; 4K while it fits, else 1440p/1080p
  git_push: false                        # commit + push state/ after every upload (always on inside GitHub Actions)
  ci_overrides:                          # GitHub-hosted runner: 4 vCPU / 16 GB
    fast: {parallel_renders: 2, frame_workers: 2, x264_threads: 2}

facebook:                                # joshiclip/facebook.py: every uploaded Short also becomes a Reel on ONE Page
  enabled: true                          # only acts when FB_PAGE_ID + FB_PAGE_TOKEN exist; never blocks YouTube
  graph_version: v23.0

music:                                   # background music bed (joshiclip/music.py); drop tracks into music/
  enabled: true                          # no files in music/ -> no music, nothing else changes
  folder: music
  gap_db: -18                            # music this far below the Short's loudness when nobody talks ...
  speech_db: -26                         # ... and this far below it while someone speaks (voice stays clear)
  highpass_hz: 120
  lowpass_hz: 12000
  voice_band_cut_db: -5                  # wide dip at 2.5 kHz so the music never masks words

fast:                                    # `joshiclip run --fast`: 360p analysis + 4K only for the winning spans
  source: auto                           # auto (YouTube, falls back to a local normalized copy) | youtube | local
  proxy_format: "134+251/bv*[height<=360][vcodec^=avc1]+ba/b[height<=360]"
  sub_langs: "hi-orig,hi"
  asr_model: large-v3-turbo              # only used when YouTube has no Hindi auto-captions
  clip_format: "bv*[height<=1080][fps<=60]+ba/b[height<=1080]"   # user: 1080p is fine (smaller, faster, less to bot-check)
  clip_pad_s: 3
  parallel_downloads: 3
  parallel_renders: 4                    # Shorts rendered at the same time (each: decoder + encoder + frame workers)
  frame_workers: 3
  x264_threads: 3
  separator: none                        # keep original sound; dfn | demucs available
  render_preset: medium                  # same CRF as final; x264 medium vs slow = ~1.5x faster, near-identical

record:                                  # JOSHICLIP_FETCH=record (GitHub Actions): play the vlog in Chrome + record it, no yt-dlp
  clip_max_quality: hd2160               # start at the best the video offers (4K) ...
  clip_min_quality: hd720                # ... step down only if even the slowest speed loses frames
  max_missing_frac: 0.01                 # picture: <= 1 % frames missing (each = one invisible 16 ms repeat) ...
  max_gap_frames: 2                      # ... and never more than 2 in a row (that would be a visible hitch)
  min_rate: 0.25                         # 4K is played at 0.25x so no frame is dropped; slower is never needed
  clip_bitrate_mbps: 20                  # at 1080p; x (h/1080)^1.5 -> 4K ~57 Mbps (H.264 via WebCodecs)
  audio_quality: tiny                    # the 1x sound pass streams 144p video: no buffering -> no sound gaps
  audio_retries: 3                       # a sound take with any pause (ad / buffering) is recorded again
  audio_kbps: 256
  analysis_quality: medium               # 360p for the full-length analysis copy (1x: 30 min vlog = 30 min)
  analysis_bitrate_mbps: 2
  headless: false                        # YouTube stalls headless Chrome; GitHub's Windows runners have a desktop
  start_timeout_s: 45                    # a quality that doesn't start playing by then -> next lower one
  pad_wait_s: 2.0
  sound_offset_ms: 0                     # manual lip-sync nudge (+ = sound later); measured error is 0-1 ms

render:
  draft: {height: 720, preset: veryfast, crf: 23, audio_bitrate: 160k}
  final: {height: 1080, preset: slow, crf: 17, audio_bitrate: 256k}
  export_candidates: {height: 360, preset: veryfast, crf: 28, audio_bitrate: 96k}
  x264_threads: 8
  grade_samples: 5
  frame_workers: 6                       # frames graded in parallel (OpenCV releases the GIL); output order fixed
